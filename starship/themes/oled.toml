# Starship OLED Theme - Minimal
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
format = """$directory$character"""
palette = "oled"
right_format = """$all"""
command_timeout = 1000

[character]
vicmd_symbol = "[N] >>>"
success_symbol = '[➜](bold green)'

[directory]
style = "bold white"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '
style = "bold gray"

[git_status]
format = '[$all_status$ahead_behind]($style) '
style = "bold light_gray"

[aws]
format = '[$symbol(profile: "$profile" )(\(region: $region\) )]($style)'
disabled = false
style = 'bold gray'
symbol = " "

[golang]
format = '[$symbol($version)]($style) '
style = "bold light_gray"
symbol = " "

[nodejs]
format = '[$symbol($version)]($style) '
style = "bold white"
symbol = " "

[rust]
format = '[$symbol($version)]($style) '
style = "bold gray"
symbol = " "

[python]
format = '[$symbol($version)]($style) '
style = "bold light_gray"
symbol = " "

[docker_context]
disabled = true

[kubernetes]
symbol = '☸ '
disabled = true

[time]
disabled = false
time_format = "%R"
style = "bold white"
format = '[$time]($style)'

[palettes.oled]
# Pure black background for OLED displays
background = "#000000"
# Grayscale palette for minimal power consumption
black = "#000000"
dark_gray = "#1a1a1a"
gray = "#808080"
light_gray = "#b0b0b0"
white = "#ffffff"
# Subtle accent for important info
accent = "#ffffff"
