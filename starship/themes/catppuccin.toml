# Starship Catppuccin Mocha Theme - Minimal
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
# A minimal left prompt
format = """$directory$character"""
palette = "catppuccin_mocha"
# move the rest of the prompt to the right
right_format = """$all"""
command_timeout = 1000

[character]
vicmd_symbol = "[N] >>>"
success_symbol = '[➜](bold green)'

[directory]
style = "bold mauve"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '
style = "bold pink"

[git_status]
format = '[$all_status$ahead_behind]($style) '
style = "bold red"

[aws]
format = '[$symbol(profile: "$profile" )(\(region: $region\) )]($style)'
disabled = false
style = 'bold blue'
symbol = " "

[golang]
format = '[$symbol($version)]($style) '
style = "bold teal"
symbol = " "

[nodejs]
format = '[$symbol($version)]($style) '
style = "bold green"
symbol = " "

[rust]
format = '[$symbol($version)]($style) '
style = "bold peach"
symbol = " "

[python]
format = '[$symbol($version)]($style) '
style = "bold yellow"
symbol = " "

[docker_context]
disabled = true

[kubernetes]
symbol = '☸ '
disabled = true

[time]
disabled = false
time_format = "%R"
style = "bold text"
format = '[$time]($style)'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
