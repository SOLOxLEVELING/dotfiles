# Starship Gruvbox Theme
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#d79921)\
$os\
$username\
[](bg:#b8bb26 fg:#d79921)\
$directory\
[](fg:#b8bb26 bg:#fb4934)\
$git_branch\
$git_status\
[](fg:#fb4934 bg:#83a598)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
[](fg:#83a598 bg:#fe8019)\
$docker_context\
[](fg:#fe8019 bg:#282828)\
$time\
[ ](fg:#282828)\
"""

[username]
show_always = true
style_user = "bg:#d79921 fg:#282828"
style_root = "bg:#d79921 fg:#282828"
format = '[$user ]($style)'
disabled = false

[os]
style = "bg:#d79921"
disabled = true

[directory]
style = "bg:#b8bb26 fg:#282828"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[c]
symbol = " "
style = "bg:#83a598 fg:#282828"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#fe8019 fg:#282828"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:#83a598 fg:#282828"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#83a598 fg:#282828"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:#fb4934 fg:#282828"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#fb4934 fg:#282828"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#83a598 fg:#282828"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:#83a598 fg:#282828"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#83a598 fg:#282828"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#83a598 fg:#282828"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#83a598 fg:#282828"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#83a598 fg:#282828"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:#83a598 fg:#282828"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#83a598 fg:#282828"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:#83a598 fg:#282828"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#282828 fg:#ebdbb2"
format = '[ ♥ $time ]($style)'
