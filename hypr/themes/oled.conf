# OLED Theme
# Pure black background for OLED displays
# High contrast with bright accents

# Border colors
$active_border = rgba(00ff00ee) rgba(00ffffff) 45deg
$inactive_border = rgba(1a1a1aee)

# Background and foreground
$background = rgba(000000ff)    # Pure black
$foreground = rgba(ffffffff)    # Pure white

# Accent colors
$accent = rgba(00ff00ff)        # Bright green
$accent_alt = rgba(00ffffff)    # Cyan

# Window colors
$window_bg = rgba(000000ff)     # Pure black
$window_fg = rgba(ffffffff)     # Pure white

# High contrast colors for OLED
# Pure Black:  rgba(000000ff)
# Pure White:  rgba(ffffffff)
# Neon Green:  rgba(00ff00ff)
# Neon Cyan:   rgba(00ffffff)
# Neon Magenta: rgba(ff00ffff)
# Neon Yellow: rgba(ffff00ff)
