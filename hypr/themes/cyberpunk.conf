# Catppuccin Mocha Theme
# Warm, pastel colors with excellent contrast
# https://github.com/catppuccin/catppuccin

# Border colors
$active_border = rgba(f5c2e7ff) rgba(fab387ff) 45deg
$inactive_border = rgba(94e2d5ff)

# Background and foreground
$background = rgba(f5c2e7ff)
$foreground = rgba(b4befeff)

# Accent colors
$accent = rgba(89b4faee)        # Blue
$accent_alt = rgba(f38ba8ee)    # Red

# Window colors
$window_bg = rgba(1e1e2eff)     # Base
$window_fg = rgba(cdd6f4ff)     # Text

