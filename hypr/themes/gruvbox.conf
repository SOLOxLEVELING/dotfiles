# Gruvbox Dark Theme
# Retro, warm, earthy colors
# https://github.com/morhetz/gruvbox

# Border colors
$active_border = rgba(d79921ee) rgba(b8bb26ee) 45deg
$inactive_border = rgba(3c3836ee)

# Background and foreground
$background = rgba(282828ee)
$foreground = rgba(ebdbb2ff)

# Accent colors
$accent = rgba(d79921ee)        # Yellow
$accent_alt = rgba(b8bb26ee)    # Green

# Window colors
$window_bg = rgba(282828ff)     # Dark background
$window_fg = rgba(ebdbb2ff)     # Light foreground

# Gruvbox Palette Reference
# Dark:   #282828, #1d2021, #32302f, #3c3836
# Light:  #a89984, #bdae93, #d5c4a1, #ebdbb2
# Red:    #cc241d, #fb4934
# Green:  #98971a, #b8bb26
# Yellow: #d79921, #fabd2f
# Blue:   #458588, #83a598
# Purple: #b16286, #d3869b
# Aqua:   #689d6a, #8ec07c
# Orange: #d65d0e, #fe8019
