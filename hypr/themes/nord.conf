# Nord Theme
# Cool, arctic colors from the Nord palette
# https://www.nordtheme.com/

# Border colors
$active_border = rgba(88c0d0ee) rgba(81a1c1ee) 45deg
$inactive_border = rgba(3b4252ee)

# Background and foreground
$background = rgba(2e3440ee)
$foreground = rgba(eceff4ff)

# Accent colors
$accent = rgba(88c0d0ee)        # Frost cyan
$accent_alt = rgba(81a1c1ee)    # Frost blue

# Window colors
$window_bg = rgba(2e3440ff)     # Polar Night
$window_fg = rgba(eceff4ff)     # Snow Storm

# Nord Palette Reference
# Polar Night: #2e3440, #3b4252, #434c5e, #4c566a
# Snow Storm:  #d8dee9, #e5e9f0, #eceff4
# Frost:       #8fbcbb, #88c0d0, #81a1c1, #5e81ac
# Aurora:      #bf616a, #d08770, #ebcb8b, #a3be8c, #b48ead
