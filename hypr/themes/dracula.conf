# Dracula Theme
# Dark, vampire-inspired purple palette
# https://draculatheme.com/

# Border colors
$active_border = rgba(bd93f9ee) rgba(ff79c6ee) 45deg
$inactive_border = rgba(44475aee)

# Background and foreground
$background = rgba(282a36ee)
$foreground = rgba(f8f8f2ff)

# Accent colors
$accent = rgba(bd93f9ee)        # Purple
$accent_alt = rgba(ff79c6ee)    # Pink

# Window colors
$window_bg = rgba(282a36ff)     # Background
$window_fg = rgba(f8f8f2ff)     # Foreground

# Dracula Palette Reference
# Background: #282a36
# Current:    #44475a
