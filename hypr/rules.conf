# ~/.config/hypr/rules.conf

##############################
### WINDOWS AND WORKSPACES ###
##############################

# 1. Block Annoyances
windowrule = suppress_event maximize, match:class .*

# 2. Smart Workspaces (Auto-move apps to specific desktops)
windowrule = workspace 1, match:class ^(kitty)$
windowrule = workspace 2, match:class ^(firefox|brave|chromium|google-chrome)$

# FIX: Use more permissive regex for Code and Zed
windowrule = workspace 3, match:class ^(code-oss|vscodium|code|Code)$
windowrule = workspace 3, match:class ^(dev.zed.Zed|zed|Zed)$

windowrule = workspace 4, match:class ^(discord)$
windowrule = workspace 4, match:class ^(Spotify)$

# 3. Floating Windows (Dialogs shouldn't tile)
windowrule = float on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:title ^(Picture-in-Picture)$

# 4. Fix Dunst Glitches (The "No Flicker" rules)
windowrule = no_anim on, match:class ^(Dunst)$
windowrule = no_blur on, match:class ^(Dunst)$
windowrule = no_shadow on, match:class ^(Dunst)$

# 5. XWayland Fixes
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

# -----------------------------------------------------
# Web App Rules (Targeting class 'udemy')
# -----------------------------------------------------

# Option A: Float and Center (Like a tool)
windowrule = float on, match:class ^(udemy)$
windowrule = size 1100 800, match:class ^(udemy)$
windowrule = center on, match:class ^(udemy)$

# Option B: Tile but keep opaque (Reading focus)
# windowrule = tile, match:class ^(udemy)$
windowrule = opaque on, match:class ^(udemy)$
windowrule = no_blur on, match:class ^(udemy)$
