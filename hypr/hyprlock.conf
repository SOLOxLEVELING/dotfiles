# Hyprlock Configuration - Modern Lock Screen (LARGER SIZES)
# Sources theme colors from current.conf

source = ~/.config/hypr/themes/current.conf

# ═══════════════════════════════════════════
# GENERAL SETTINGS
# ═══════════════════════════════════════════
general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
}

# ═══════════════════════════════════════════
# BACKGROUND - Blurred Screenshot
# ═══════════════════════════════════════════
background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    noise = 0.02
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# ═══════════════════════════════════════════
# TIME - Big Bold Clock
# ═══════════════════════════════════════════
label {
    monitor =
    text = $TIME
    text_align = center
    color = rgba(255, 255, 255, 1.0)
    font_size = 180
    font_family = JetBrainsMono Nerd Font Bold
    
    position = 0, 280
    halign = center
    valign = center
}

# ═══════════════════════════════════════════
# DATE
# ═══════════════════════════════════════════
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    text_align = center
    color = rgba(255, 255, 255, 0.8)
    font_size = 36
    font_family = JetBrainsMono Nerd Font
    
    position = 0, 120
    halign = center
    valign = center
}

# ═══════════════════════════════════════════
# GREETING - "Hi, User"
# ═══════════════════════════════════════════
label {
    monitor =
    text = Hi, $USER 👋
    text_align = center
    color = rgba(255, 255, 255, 0.9)
    font_size = 32
    font_family = JetBrainsMono Nerd Font
    
    position = 0, -30
    halign = center
    valign = center
}

# ═══════════════════════════════════════════
# PASSWORD INPUT - Larger Pill Shape
# ═══════════════════════════════════════════
input-field {
    monitor =
    size = 450, 70
    outline_thickness = 4
    dots_size = 0.4
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1
    
    outer_color = $active_border
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgba(255, 255, 255, 1.0)
    font_size = 24
    
    fade_on_empty = false
    fade_timeout = 1000
    
    placeholder_text = <i>Enter Password...</i>
    hide_input = false
    rounding = 35
    
    check_color = rgba(166, 227, 161, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)
    fail_text = <i>Wrong Password</i>
    fail_transition = 300
    
    capslock_color = rgba(249, 226, 175, 1.0)
    numlock_color = -1
    bothlock_color = -1
    
    position = 0, -140
    halign = center
    valign = center
}

# ═══════════════════════════════════════════
# HINT TEXT
# ═══════════════════════════════════════════
label {
    monitor =
    text = Type to unlock
    text_align = center
    color = rgba(255, 255, 255, 0.5)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    
    position = 0, -230
    halign = center
    valign = center
}
