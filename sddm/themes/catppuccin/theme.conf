[General]
# 🖼️ BACKGROUND & FONT
Background="wall.jpg"
Font="JetBrainsMono Nerd Font"
GeneralFontSize=16

# 📏 SIZE & GEOMETRY (Crucial for fixing tiny boxes)
LoginScale=0.25
CornerRadius=20

# 🕒 CLOCK & DATE
DateSize=60
DateIsBold="true"
DateOpacity=1.0
DateColor="#ffffff"
DateFormat="dddd, MMMM d"

TimeSize=88
TimeIsBold="true"
TimeOpacity=1.0
TimeColor="#ffffff"
TimeFormat="hh:mm AP"

# ⌨️ INPUT FIELDS
UserFieldBgText="Username"
PasswordFieldBgText="Password"
TextFieldColor="#1e1e2e"
TextFieldTextColor="#1e1e2e"
TextFieldHighlightColor="#cba6f7"
TextFieldHighlightWidth=3

# 👤 USER PICTURE
UserPictureColor="#1e1e2e"
UserPictureBorderWidth=3
UserPictureBorderColor="#cba6f7"

# 🚪 BUTTONS (Login, Power, Session)
LoginButtonText="Login"
LoginButtonTextColor="#1e1e2e"
LoginButtonBgColor="#cba6f7"

PowerButtonColor="#1e1e2e"
PowerIconColor="#cba6f7"
SessionButtonColor="#1e1e2e"
SessionIconColor="#cba6f7"

# 🎨 POPUP COLORS (Session/Power Menu)
PopupBgColor="#1e1e2e"
PopupHighlightColor="#cba6f7"
PopupHighlightedTextColor="#1e1e2e"
